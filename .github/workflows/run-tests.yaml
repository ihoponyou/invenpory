name: Run tests

on: [push]

jobs:
  install-deps:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

  test-game:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
    - name: Test game module
      run: pytest -vs game

  test-server:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
    - name: Test server module
      run: pytest -vs server
